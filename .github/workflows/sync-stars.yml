name: Sync stars & leaderboard

on:
  schedule:
    - cron: "7 6 * * *" # daily 06:07 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Refresh star counts and last-checked date
        run: python scripts/sync_stars.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Build project leaderboard
        run: python scripts/leaderboard.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit updated metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md README.zh-CN.md data/star-cache.json data/leaderboard-history.json LEADERBOARD.md LEADERBOARD.zh-CN.md
          git diff --cached --quiet || git commit -m "chore: sync star counts and leaderboard [skip ci]"
          git push
